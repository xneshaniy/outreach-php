<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sapphire Hand Gradient -->
    <linearGradient id="dkHandGrad" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#0242A6" />
      <stop offset="55%" stop-color="#0265D2" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Cyan Waves Gradient -->
    <linearGradient id="dkWaveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="dkTextAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <filter id="dkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0EA5E9" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Scaled & Positioned Icon Symbol -->
  <g transform="translate(10, 0)">
    <!-- Concentric Click Waves -->
    <g filter="url(#dkGlow)" stroke="url(#dkWaveGrad)" stroke-linecap="round" fill="none">
      <path d="M 64 36 A 11 11 0 0 1 82 36" stroke-width="3" />
      <path d="M 57 31 A 19 19 0 0 1 89 31" stroke-width="3" />
      <path d="M 50 26 A 27 27 0 0 1 96 26" stroke-width="3" />
    </g>

    <!-- Hand Contours -->
    <g fill="url(#dkHandGrad)">
      <path d="M 69 40 C 69 36 77 36 77 40 L 76 70 C 76 71.5 74.5 73 73 73 C 71.5 73 70 71.5 70 70 Z" />
      <path d="M 64 50 C 64 47 68 47 68 50 L 68 65 C 68 66 67 67 65.5 67 C 64 67 64 66 64 65 Z" />
      <path d="M 59 55 C 59 52 63 52 63 55 L 63 67 C 63 68 61.5 69 60.5 69 C 59 69 59 68 59 67 Z" />
      <path d="M 54 60 C 54 57 58 57 58 60 L 58 71 C 58 72 56.5 73 55.5 73 C 54 73 54 72 54 71 Z" />
      <path d="M 78 63 C 78 61 80 60 82.5 61 C 86.5 64 91 68 89.5 72 C 88 74.5 84 74 81.5 72 C 79.5 70 78 67 78 63 Z" />

      <path d="M 57 76 C 61 75 67 74 74 75 C 80 77 84 80 82 82.5 C 80.5 84.5 76 83.5 71 81.5 C 66 79.5 60 80.5 56 81.5 C 54.5 81.5 54.5 77 57 76 Z" />
      <path d="M 55 86 C 60 84.5 66 83.5 72 85 C 78 86.5 80.5 89 79 91.5 C 77 93.5 72.5 92 68 90 C 63 88 57.5 89.5 54 90.5 C 52.5 90.5 52.5 87 55 86 Z" />
      <path d="M 53 95 C 58 93.5 64 92.5 69 94 C 74 95.5 76 98 74 100 C 72 102 68.5 101 64 99 C 60 97 56 98.5 52 99.5 C 50.5 99.5 50.5 96 53 95 Z" />
      <path d="M 52 104 C 56 102.5 62 101.5 67 103 C 71 104 72.5 106.5 70.5 108.5 C 68.5 110 65 109.5 61 108 C 57 106.5 54 107.5 51 108.5 C 49.5 108.5 49.5 105 52 104 Z" />
    </g>
  </g>

  <!-- Right: Deep Slate Typography -->
  <g transform="translate(135, 78)">
    <text font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#0F172A">
      Outreach<tspan fill="url(#dkTextAccent)">.click</tspan>
    </text>
  </g>
</svg>
