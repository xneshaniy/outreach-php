name: CI — Outreach CRM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: PHP Tests (SQLite in-memory, fast)
  # phpunit.xml already sets DB_CONNECTION=sqlite
  # ─────────────────────────────────────────────
  php-checks:
    name: PHP Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo, pdo_sqlite, pdo_mysql, curl, openssl, pcntl, zip, exif, gd
          coverage: none

      - name: Copy .env for testing
        run: cp .env.example .env

      - name: Patch .env for CI (safe defaults, SQLite in-memory)
        run: |
          sed -i 's|^APP_KEY=.*|APP_KEY=|'            .env
          sed -i 's|^APP_ENV=.*|APP_ENV=testing|'      .env
          sed -i 's|^APP_DEBUG=.*|APP_DEBUG=false|'    .env
          sed -i 's|^APP_URL=.*|APP_URL=http://localhost|' .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=:memory:|'   .env
          sed -i 's|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|' .env
          sed -i 's|^SESSION_DRIVER=.*|SESSION_DRIVER=array|'    .env
          sed -i 's|^CACHE_DRIVER=.*|CACHE_STORE=array|'          .env
          sed -i 's|^MAIL_MAILER=.*|MAIL_MAILER=array|'           .env

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHP syntax check
        run: find app -name "*.php" -print0 | xargs -0 -P4 php -l | grep -v "^No syntax errors" && echo "✓ PHP syntax OK" || true

      - name: Run all tests (SQLite in-memory)
        run: php artisan test --stop-on-failure

  # ─────────────────────────────────────────────
  # Job 2: Frontend build & asset verification
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify critical assets compiled
        run: |
          echo "=== Checking critical compiled assets ==="
          MISSING=0

          if ls public/build/assets/ | grep -q 'AdminLayout'; then
            echo "✓ AdminLayout found"
          else
            echo "✗ AdminLayout asset MISSING"
            MISSING=1
          fi

          if ls public/build/assets/ | grep -q 'Dashboard-'; then
            echo "✓ Dashboard found"
          else
            echo "✗ Dashboard asset MISSING"
            MISSING=1
          fi

          if ls public/build/assets/ | grep -q 'MainLayout'; then
            echo "✓ MainLayout found"
          else
            echo "✗ MainLayout asset MISSING"
            MISSING=1
          fi

          if [ -f public/build/manifest.json ]; then
            echo "✓ manifest.json exists"
          else
            echo "✗ manifest.json MISSING"
            MISSING=1
          fi

          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "ERROR: One or more critical assets are missing from the build!"
            exit 1
          fi

          echo ""
          echo "✓ All critical assets verified"

  # ─────────────────────────────────────────────
  # Job 3: Basic security checks
  # ─────────────────────────────────────────────
  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check .env is not committed
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: .env file must not be committed to the repository!"
            exit 1
          fi
          echo "✓ .env is not committed"

      - name: Check vendor is not committed
        run: |
          if [ -d "vendor" ]; then
            echo "WARNING: vendor/ directory is committed - consider adding it to .gitignore"
          else
            echo "✓ vendor/ is not committed"
          fi

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential hardcoded secrets..."
          FOUND=0

          # Check for hardcoded passwords (not env/config references)
          if grep -rn "password\s*=\s*['\"][^'\"]\{6,\}['\"]" app/ config/ routes/ \
              --include="*.php" \
              | grep -v "env(\|config(\|Hash::\|bcrypt\|password_confirmation\|placeholder\|example\|your_\|changeme\|test_\|fake" \
              | grep -v "#" \
              | head -5; then
            echo "WARNING: Possible hardcoded passwords detected above — please review"
          else
            echo "✓ No obvious hardcoded passwords found"
          fi

          echo "✓ Security scan complete"
