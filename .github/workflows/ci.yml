name: CI — Outreach CRM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-checks:
    name: PHP Lint & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: outreach_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo, pdo_mysql, curl, openssl
          coverage: none

      - name: Copy .env for testing
        run: cp .env.example .env

      - name: Set test DB credentials
        run: |
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=outreach_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env
          sed -i 's/APP_KEY=.*/APP_KEY=/' .env

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-scripts --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run PHPUnit tests
        run: php artisan test --parallel --stop-on-failure
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: outreach_test
          DB_USERNAME: root
          DB_PASSWORD: secret

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Check Admin pages compiled
        run: |
          ls public/build/assets/ | grep -E 'AdminLayout|Dashboard-' || (echo "Admin assets missing!" && exit 1)
          echo "✓ Admin assets present in build"

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for exposed secrets
        run: |
          echo "Checking for potential secret exposure..."
          if grep -r "password.*=.*['\"][^'\"]\+['\"]" app/ routes/ config/ --include="*.php" | grep -v "Hash\|bcrypt\|env(\|config(\|placeholder\|example" | head -5; then
            echo "WARNING: Potential hardcoded passwords found (review above)"
          else
            echo "✓ No hardcoded passwords found"
          fi
          if [ -f ".env" ]; then
            echo "ERROR: .env file should not be committed!" && exit 1
          fi
          if [ -d "vendor" ]; then
            echo "WARNING: vendor/ directory should not be committed"
          fi
          echo "✓ Security check passed"
